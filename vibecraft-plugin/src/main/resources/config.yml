# VibeCraft configuration
# Paths are relative to the server directory.
modules-dir: ../workspace/modules
data-dir: ../workspace/data

# Reload a module automatically when its .java / config.yml / module.yml files change.
auto-reload: true
# How often module directories are scanned for changes, and how long files must be stable before reloading.
poll-interval-ms: 750
debounce-ms: 1200

guard:
  # Max main-thread time for one guarded call (event handler, command, scheduled task) before it is interrupted.
  handler-budget-ms: 250
  # Max time for VibeModule.enable()/disable().
  enable-budget-ms: 2000
  # Fallback for module code running on the main thread outside a guarded call: max time since the tick started.
  tick-budget-ms: 2000
  # Circuit breaker: that many runtime errors within the window disables (TRIPS) the module.
  error-burst-limit: 25
  error-burst-window-ms: 10000

api:
  enabled: true
  host: 127.0.0.1
  port: 8765
  # If non-empty, every /api request must send the header "X-Vibe-Token: <token>" (the dashboard asks for it).
  token: ""
  # true = dashboard reachable from the Internet at http://<ip-of-the-server>:<port>/ (open the port in the firewall).
  # Requires a token above: it is the dashboard password (asked once, remembered by the browser). Plain HTTP:
  # pick a password used nowhere else.
  public: false

notify:
  # Tell everyone in chat when a module is (re)loaded - nice for live demos.
  broadcast-reloads: true
  # Send errors / rollbacks to players with vibecraft.notify (ops).
  errors-to-ops: true

ai:
  enabled: true
  # "auto" = search PATH, then %APPDATA%/Claude/claude-code/<version>/<hash>/claude.exe (newest).
  claude-path: auto
  # Empty = Claude Code default model. E.g. "sonnet" for faster live demos, "opus" for harder features.
  model: ""
  # Claude Code permission mode for headless jobs.
  permission-mode: acceptEdits
  # Tools the headless agent may use without asking (Bash is restricted to curl calls to the local API).
  allowed-tools:
    - Read
    - Write
    - Edit
    - MultiEdit
    - Glob
    - Grep
    - Bash(curl:*)
  max-concurrent-jobs: 4
  # Hang guard: a job is stopped after this long WITHOUT ANY ACTIVITY (no message, no step, no tool call).
  # A job that keeps working is never cut by it, only by max-duration-seconds.
  timeout-seconds: 900
  # Hard limit on the total duration of a job (0 = no limit). Big requests can take a while: keep it generous.
  max-duration-seconds: 3600
  # Show what the AI is doing (chat lines + action bar) to every player (true) or only to players with
  # vibecraft.notify, i.e. ops (false). Replaces the old "broadcast-progress" key, which is no longer read.
  progress-to-everyone: false
  # Keep one Claude conversation per module so follow-up requests have context.
  resume-sessions: true
  # Optional Claude Code MCP config for AI jobs (JSON: {"mcpServers": {...}}), absolute or relative to the
  # server directory or plugins/VibeCraft/. Every server listed is allowed (tools mcp__<server>). "" = no MCP.
  mcp-config: ""
  # Extra environment variables for AI jobs (the OpenRouter key of secrets.yml is added as OPENROUTER_API_KEY).
  env: {}
  # Thinking enabled with summaries for every job (passed with --settings plugins/VibeCraft/ai-job-settings.json),
  # so the conversations (dashboard, in-game dialog, /api/conversations) show Claude's reasoning.
  # Conversations are kept in plugins/VibeCraft/conversations/<module>.json (last 300 messages, secrets redacted).
  thinking: true

# In-game interface.
ui:
  # What /vibe without arguments opens for a player: "claude" (conversations dialog) or "menu" (chest menu).
  vibe-opens: claude
  # Sneak + right click with a compass opens the Claude dialog (players with vibecraft.admin).
  compass-opens-claude: true
  # Players with vibecraft.admin get a "Montre VibeCraft" (clock): right click opens /vibe.
  clock-opens-vibe: true

ideas:
  enabled: true
  # Cooldown between two /idea from the same player.
  cooldown-seconds: 20

# Hot resource pack: modules/<id>/assets/** of every running module, merged and rebuilt ~1 s after any asset
# change, served over HTTP. By default players get it ON DEMAND: they are told "🧭 Nouvelles textures dispo :
# clic droit avec une boussole" and the pack is sent when they right-click holding a compass (the client
# reloads in place, nobody is disconnected).
resource-pack:
  enabled: true
  # true = old behaviour: pushed automatically on join and after every change (the client freezes a moment each time).
  auto-push: false
  # Give one compass on join to players who have none (on-demand mode).
  give-compass: true
  # Minimum time between two compass uses of the same player.
  compass-cooldown-ms: 3000
  # HTTP server for the zip (players' clients download from it: it must be reachable from their machines).
  bind: 0.0.0.0
  port: 8766
  # Host put in the pack URL. "auto" = the address each player typed to join (localhost, LAN IP, domain...),
  # else this machine's LAN IP. Set it explicitly (LAN IP / public domain) if players get FAILED_DOWNLOAD.
  public-host: auto
  # true = players who decline the pack are kicked (not recommended for a demo).
  required: false
  # Prompt shown by the client (MiniMessage). Empty = default French text.
  prompt: ""
  debounce-ms: 1000
  # Pack format; 0 = auto (read from the server's version.json, 97 for 26.3).
  min-format: 0
  max-format: 0

# OpenRouter (LLM + image generation) for modules (dev.vibecraft.api.OpenRouter) and texture generation
# (POST /api/modules/<id>/textures). The KEY goes in plugins/VibeCraft/secrets.yml ("openrouter: sk-or-...")
# or in the OPENROUTER_API_KEY environment variable, never here.
openrouter:
  base-url: https://openrouter.ai/api/v1
  # Default chat model for modules (cheap and fast).
  model: google/gemini-2.5-flash-lite
  # Image model for texture generation.
  image-model: google/gemini-2.5-flash-image
  # images = POST /images, chat = chat completions with modalities [image, text], auto = images then chat.
  image-api: auto
  max-tokens: 400
  timeout-seconds: 60
  image-timeout-seconds: 120
  # Whole-server limits (protect the credit during a live demo).
  max-requests-per-minute: 30
  max-concurrent: 4
  max-concurrent-images: 2

# Meshy AI (https://docs.meshy.ai): textures (text-to-image, "provider":"meshy" in POST /api/modules/<id>/textures)
# and realistic 3D objects (text-to-3D, POST /api/modules/<id>/models3d). KEY in plugins/VibeCraft/secrets.yml
# ("meshy: msy_...") or the MESHY_API_KEY environment variable, never here.
meshy:
  base-url: https://api.meshy.ai
  # Text-to-image model (nano-banana, nano-banana-2, gpt-image-2...).
  image-model: nano-banana
  # Text-to-3D model (latest, meshy-6, meshy-6-lite...) and polygon budget asked to Meshy (decimated again by VibeCraft).
  model-3d: latest
  target-polycount: 8000
  poll-interval-ms: 3000
  timeout-seconds: 900
  max-concurrent-3d: 2

# Default image provider of the texture endpoint when neither the request nor the AI job chose one:
# auto (OpenRouter if it has a key, else Meshy), openrouter or meshy.
images:
  default-provider: auto

# Secrets can also be listed here (name: value), but prefer plugins/VibeCraft/secrets.yml (never shared,
# re-read live). Environment variables VIBECRAFT_SECRET_<NAME> work too.
secrets: {}
