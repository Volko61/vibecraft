# VibeReconnect - filet de securite VibeCraft (fichier UTF-8, format .properties)
# Modifie ce fichier puis tape "vibeproxy reload" dans la console Velocity.

# Noms des serveurs tels que declares dans velocity.toml [servers]
main-server=main
limbo-server=limbo

# Ping du serveur principal (ms)
ping-interval-ms=2000
ping-timeout-ms=1500
# Nombre de pings OK consecutifs avant de considerer le serveur principal "pret"
required-successful-pings=1

# Temps minimum passe dans le limbo avant un retour (ms)
min-limbo-ms=2000
# Un joueur envoye au limbo revient des que le principal a ete vu HORS LIGNE puis de nouveau EN LIGNE.
# Si le principal n'a jamais ete vu hors ligne (kick inattendu mais serveur toujours vivant),
# le retour est quand meme tente apres ce delai (ms).
force-return-after-ms=15000
# Delai entre deux joueurs renvoyes (evite la ruee sur un serveur qui vient de demarrer)
return-stagger-ms=250
# Backoff maximum entre deux tentatives de retour ratees pour un meme joueur (ms)
return-backoff-max-ms=30000

# Serveur principal FIGE (JVM vivante mais thread principal bloque : il repond encore aux pings
# mais n'envoie plus rien aux joueurs). Sans rien faire, Velocity deconnecte les joueurs au bout de
# 30 s ("read timeout"). Si AUCUN joueur du principal n'a recu de paquet depuis freeze-threshold-ms,
# tout le monde est evacue vers le limbo (retour automatique ensuite).
freeze-guard=true
freeze-threshold-ms=10000

# Kicks "volontaires" (ban, /kick, whitelist...) : le joueur est deconnecte normalement au lieu
# d'aller au limbo. Liste de fragments (insensible a la casse) cherches dans la raison du kick
# (cles de traduction comprises). Laisser vide pour envoyer TOUS les kicks au limbo.
deliberate-kick-patterns=multiplayer.disconnect.kicked,multiplayer.disconnect.banned,multiplayer.disconnect.not_whitelisted,multiplayer.disconnect.idling,kicked by an operator,not whitelisted,banned,expulsé,banni

# Messages (MiniMessage). Placeholders : <seconds>, <reason>
title=<gold><bold>Le serveur redémarre…
subtitle=<gray>ne bouge pas, tu reviens automatiquement
actionbar-waiting=<yellow>⏳ Serveur principal hors ligne · attente <white><seconds>s</white>
actionbar-returning=<green>✔ Serveur principal en ligne · retour en cours...
back-title=<green><bold>De retour !
back-subtitle=<gray>merci d'avoir patienté (<seconds>s)
# Message de chat a l'arrivee dans le limbo (vide = aucun message)
redirect-message=<gray>⏸ Serveur principal indisponible (<reason>) : tu patientes ici, retour automatique.
return-failed-message=<gray>Retour impossible pour l'instant (<reason>), nouvel essai dans <seconds>s...

# Fichier d'etat JSON (relatif a ce dossier), reecrit a chaque ping. Vide = desactive.
status-file=status.json
debug=false
